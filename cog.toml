from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = true
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
# branch_whitelist = ["main", "next"]
skip_ci = "[skip ci]"
skip_untracked = true

# Default hooks for main branch (stable releases)
# Note: Version bumping is now handled by GitHub Actions (release-core composite action)
# These hooks are kept for local development/testing only
pre_bump_hooks = [
    # Stage package.json if it was modified (version updates) - use POSIX [ ] for sh compatibility
    """sh -c 'if [ -f package.json ] && ! git diff --quiet package.json; then git add package.json; fi'""",
    # Discard any changes to mise.toml (it may be auto-updated by mise but shouldn't be committed)
    """sh -c 'git checkout -- mise.toml 2>/dev/null || true'""",
]

post_bump_hooks = []

pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles.next]
# Profile for prerelease versions on next branch
# Note: Version bumping is now handled by GitHub Actions (release-core composite action)
# These hooks are kept for local development/testing only
pre_bump_hooks = [
    # Stage package.json if it was modified (for prerelease version update) - use POSIX [ ] for sh compatibility
    """sh -c 'if [ -f package.json ] && ! git diff --quiet package.json; then git add package.json; fi'""",
    # Discard any changes to mise.toml (it may be auto-updated by mise but shouldn't be committed)
    """sh -c 'git checkout -- mise.toml 2>/dev/null || true'""",
]

post_bump_hooks = []

[bump_profiles.dev]
# Profile for dev/preview versions on feature branches
# Note: Version bumping is now handled by GitHub Actions (release-core composite action)
# These hooks are kept for local development/testing only
pre_bump_hooks = [
    # Stage package.json if it was modified
    """sh -c 'if [ -f package.json ] && ! git diff --quiet package.json; then git add package.json; fi'""",
    # Discard any changes to mise.toml
    """sh -c 'git checkout -- mise.toml 2>/dev/null || true'""",
]

post_bump_hooks = []

[packages]
