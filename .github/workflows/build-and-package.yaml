name: Build and Package

on:
    workflow_call:
        outputs:
            artifact-id:
                description: 'GitHub Artifact ID of produced artifact'
                value: ${{ jobs.build.outputs.artifact-id }}
            artifact-digest:
                description: 'GitHub Artifact Digest of produced artifact'
                value: ${{ jobs.build.outputs.artifact-digest }}

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        outputs:
            artifact-id: ${{ steps.upload.outputs.artifact-id }}
            artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  eisable-sudo-and-containers: true
                  egress-policy: audit
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      mise-versions.jdx.dev:443
                      mise.jdx.dev:443
                      objects.githubusercontent.com:443
                      registry.npmjs.org:443
                      release-assets.githubusercontent.com:443
                      tuf-repo-cdn.sigstore.dev:443

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install mise
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              with:
                  install: true
                  install_args: --yes

            - name: Sync SvelteKit
              shell: bash
              run: mise run sync

            - name: Build static site
              shell: bash
              run: mise run build

            - name: Upload artifact
              id: upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-artifact
                  path: build/
                  retention-days: 1
                  compression-level: 9
                  if-no-files-found: error
