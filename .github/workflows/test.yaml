name: Run Unit and Integration Tests

on:
    workflow_dispatch:
    workflow_call:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test and Check
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit
                  allowed-endpoints: >
                      api.github.com:443
                      archive.ubuntu.com:80
                      azure.archive.ubuntu.com:80
                      github.com:443
                      mise-versions.jdx.dev:443
                      mise.jdx.dev:443
                      objects.githubusercontent.com:443
                      packages.microsoft.com:443
                      playwright.azureedge.net:443
                      registry.npmjs.org:443
                      release-assets.githubusercontent.com:443
                      security.ubuntu.com:80
                      tuf-repo-cdn.sigstore.dev:443

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install mise
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              with:
                  install_args: --yes

            - name: Install dependencies
              run: mise run install

            - name: Sync SvelteKit
              run: mise run sync

            - name: Run linting
              run: mise run lint

            - name: Run type checking
              run: mise run check

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps

            - name: Run unit tests
              run: mise run test-unit -- --run

            - name: Run E2E tests
              run: mise run test-e2e
