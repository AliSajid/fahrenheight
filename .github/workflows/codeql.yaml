name: CodeQL Analysis

on:
    pull_request:
        branches:
            - main
            - next
    schedule:
        - cron: '31 19 * * 5'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze TypeScript
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            security-events: write # Write permission to add things into the security dashboard
            contents: read
        strategy:
            fail-fast: false
            matrix:
                language:
                    - typescript

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  languages: ${{ matrix.language }}
                  source-root: src
                  config: |
                      queries:
                        - uses: security-and-quality
                        - uses: security-extended

            - name: Autobuild
              uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  category: '/language:${{ matrix.language }}'
