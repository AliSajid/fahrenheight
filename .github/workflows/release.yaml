name: Release Workflow

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            artifact_id:
                description: 'GitHub Artifact ID of produced artifact'
                required: true
                type: string
            artifact_digest:
                description: 'GitHub Artifact Digest of produced artifact'
                required: true
                type: string
            release_type:
                description: 'Type of release: stable, next, dev'
                required: true
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write
    actions: read

jobs:
    publish-release:
        name: Publish Release
        runs-on: ubuntu-latest
        if: ${{ inputs.release_type == 'dev' || inputs.release_type == 'next' || inputs.release_type == 'stable' }}
        steps:
            - name: Run release core
              uses: ./.github/actions/release-core
              with:
                  artifact_id: ${{ inputs.artifact_id }}
                  artifact_digest: ${{ inputs.artifact_digest }}
                  release_type: ${{ inputs.release_type }}
