name: Release Workflow

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            artifact_id:
                description: 'GitHub Artifact ID of produced artifact'
                required: true
                type: string
            artifact_digest:
                description: 'GitHub Artifact Digest of produced artifact'
                required: true
                type: string
            release_type:
                description: 'Type of release: stable, next, dev'
                required: true
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write
    actions: read

jobs:
    publish-release:
        name: Publish Release
        runs-on: ubuntu-latest
        if: ${{ inputs.release_type == 'dev' || inputs.release_type == 'next' || inputs.release_type == 'stable' }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
              with:
                  disable-sudo: true
                  egress-policy: block
                  allowed-endpoints: |
                      api.github.com:443
                      github.com:443
                      mise.jdx.dev:443
                      objects.githubusercontent.com:443
                      registry.npmjs.org:443
                      uploads.github.com:443
                      fulcio.sigstore.dev:443
                      rekor.sigstore.dev:443
                      tuf-repo-cdn.sigstore.dev:443
                      keys.openpgp.org:443

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0
            - name: Run release core
              uses: ./.github/actions/release-core
              with:
                  artifact_id: ${{ inputs.artifact_id }}
                  artifact_digest: ${{ inputs.artifact_digest }}
                  release_type: ${{ inputs.release_type }}
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  gpg_passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
