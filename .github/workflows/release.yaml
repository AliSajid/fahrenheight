name: Release Workflow

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            artifact_id:
                description: 'GitHub Artifact ID of produced artifact'
                required: true
                type: string
            artifact_digest:
                description: 'GitHub Artifact Digest of produced artifact'
                required: true
                type: string
            release_type:
                description: 'Type of release: stable, next, dev'
                required: true
                type: string
        secrets:
            GPG_PRIVATE_KEY:
                description: 'ASCII-armored GPG private key for signing releases'
                required: true
            GPG_KEY_PASSPHRASE:
                description: 'Passphrase for the GPG private key'
                required: true
            GITHUB_TOKEN:
                description: 'GitHub token used to create releases'
                required: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish-release:
        name: Publish Release
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        if: ${{ inputs.release_type == 'dev' || inputs.release_type == 'next' || inputs.release_type == 'stable' }}
        permissions:
            id-token: write # Write permission to ID token for attestation
            attestations: write # Write permission for writing the attestation
            contents: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  disable-sudo: true
                  egress-policy: block
                  allowed-endpoints: |
                      api.github.com:443
                      github.com:443
                      mise.jdx.dev:443
                      objects.githubusercontent.com:443
                      registry.npmjs.org:443
                      uploads.github.com:443
                      fulcio.sigstore.dev:443
                      rekor.sigstore.dev:443
                      tuf-repo-cdn.sigstore.dev:443
                      keys.openpgp.org:443

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Run release core
              uses: $/.github/actions/release-core
              with:
                  artifact_id: ${{ inputs.artifact_id }}
                  artifact_digest: ${{ inputs.artifact_digest }}
                  release_type: ${{ inputs.release_type }}
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  gpg_passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
