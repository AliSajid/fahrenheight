name: Deploy Site (Called)

on:
    workflow_call:
        inputs:
            artifact_id:
                description: 'GitHub Artifact ID produced by build-and-package workflow'
                required: true
                type: string
            artifact_digest:
                description: 'GitHub Artifact Digest (for provenance/auditing)'
                required: true
                type: string
            release_type:
                description: 'Release channel: stable | next | dev'
                required: true
                type: string
        secrets:
            CLOUDFLARE_API_TOKEN:
                description: 'Cloudflare API token for Pages deployment'
                required: true
            CLOUDFLARE_ACCOUNT_ID:
                description: 'Cloudflare account ID for Pages deployment'
                required: true
    workflow_dispatch:
        inputs:
            release_type:
                description: 'Release channel to deploy (stable|next|dev)'
                required: true
                default: dev
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    target:
        name: Resolve Deployment Target
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            pages_branch: ${{ steps.compute.outputs.pages_branch }}
            environment_name: ${{ steps.compute.outputs.environment_name }}
            concurrency_group: ${{ steps.compute.outputs.concurrency_group }}
        steps:
            - name: Map release_type to target
              id: compute
              shell: bash
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
              run: |
                  # Map the release_type input to branch/environment/concurrency values.
                  # Guard against unexpected values to avoid unsafe interpolation.
                  case "$RELEASE_TYPE" in
                    stable)
                      echo "pages_branch=main" >> "$GITHUB_OUTPUT"
                      echo "environment_name=production" >> "$GITHUB_OUTPUT"
                      echo "concurrency_group=cloudflare-pages-production" >> "$GITHUB_OUTPUT"
                      ;;
                    next)
                      echo "pages_branch=next" >> "$GITHUB_OUTPUT"
                      echo "environment_name=next" >> "$GITHUB_OUTPUT"
                      echo "concurrency_group=cloudflare-pages-next" >> "$GITHUB_OUTPUT"
                      ;;
                    dev)
                      echo "pages_branch=dev" >> "$GITHUB_OUTPUT"
                      echo "environment_name=preview" >> "$GITHUB_OUTPUT"
                      echo "concurrency_group=cloudflare-pages-dev" >> "$GITHUB_OUTPUT"
                      ;;
                    *)
                      echo "Unsupported release_type value" >&2
                      exit 1
                      ;;
                  esac

    deploy:
        name: Deploy to Cloudflare Pages
        needs: target
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        environment:
            name: ${{ needs.target.outputs.environment_name }}
        concurrency:
            group: ${{ needs.target.outputs.concurrency_group }}
            cancel-in-progress: false
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  disable-sudo-and-containers: true
                  egress-policy: block
                  allowed-endpoints: |
                      api.github.com:443
                      github.com:443
                      api.cloudflare.com:443
                      registry.npmjs.org:443
                      objects.githubusercontent.com:443
                      release-assets.githubusercontent.com:443
                      tuf-repo-cdn.sigstore.dev:443

            - name: Install mise
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              with:
                  install_args: --yes
                  install: true
                  cache: false

            - name: Download build artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  artifact-ids: ${{ inputs.artifact_id }}
                  path: build

            - name: Inspect download
              shell: bash
              run: |
                  echo 'Contents after download:'
                  find build -print | head -100 || true
            - name: Deploy with Wrangler Action
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              # pragma: allowlist secret
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: >-
                      pages deploy build
                      --project-name=fahrenheight
                      --branch=${{ needs.target.outputs.pages_branch }}
