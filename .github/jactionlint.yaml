# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: default

baseline: auto

online: false

rules:
    secrets-outside-env: off

config-variables: null

config-secrets: null # pragma: allowlist secret

ignores:
    - rule: unused-workflow-input
      file: '.github/workflows/deploy.yaml'
      reason: 'Used for provenance'
# Controls what permissions are assumed for a caller workflow that declares no
# "permissions:" block at all when checking reusable workflow calls. Unset, the
# permissive default is assumed. Set to "restricted" to assume GitHub's
# restricted default token. Set to "permissive" to assume write on every scope.
#assume-default-permissions: restricted
