name: 'Release Core'
description: 'Prepare artifact, generate notes, sign, and publish GitHub release with SLSA attestation.'
author: 'fahrenheight project'
inputs:
    artifact_id:
        description: 'GitHub Artifact ID to download'
        required: true
    artifact_digest:
        description: 'GitHub Artifact digest (unused, reserved for provenance)'
        required: true
    release_type:
        description: 'Release channel: stable | next | dev'
        required: true
    gpg_private_key:
        description: 'ASCII-armored GPG private key.'
        required: true
    gpg_passphrase:
        description: 'Passphrase for the GPG private key.'
        required: true
    github_token:
        description: 'GitHub token used to create releases'
        required: true
outputs:
    release_version:
        description: 'Computed semantic version'
        value: ${{ steps.version.outputs.version }}
    release_name:
        description: 'Display name for release'
        value: ${{ steps.version.outputs.release_name }}
    artifact_file:
        description: 'Final zip artifact filename'
        value: ${{ steps.artifact-name.outputs.file }}
runs:
    using: 'composite'
    steps:
        - name: Validate inputs
          shell: bash
          env:
              GPG_KEY: ${{ inputs.gpg_private_key }}
              GPG_PASS: ${{ inputs.gpg_passphrase }}
              GH_TOKEN: ${{ inputs.github_token }}
              RELEASE_TYPE: ${{ inputs.release_type }}
          run: |
              set -e

              # Validate required secret inputs are not empty
              if [ -z "$GPG_KEY" ]; then
                echo "::error::gpg_private_key input is required but not provided"
                exit 1
              fi

              if [ -z "$GPG_PASS" ]; then
                echo "::error::gpg_passphrase input is required but not provided"
                exit 1
              fi

              if [ -z "$GH_TOKEN" ]; then
                echo "::error::github_token input is required but not provided"
                exit 1
              fi

              # Validate release_type
              case "$RELEASE_TYPE" in
                stable|next|dev)
                  echo "✓ Valid release_type: $RELEASE_TYPE"
                  ;;
                *)
                  echo "::error::Invalid release_type: $RELEASE_TYPE. Must be: stable, next, or dev"
                  exit 1
                  ;;
              esac

              echo "All required inputs validated"

        - name: Setup mise + cog
          uses: jdx/mise-action@f8dfbcc150159126838e44b882bf34bd98fd90f3 # v2.1.0
          with:
              install_args: --yes

        - name: Download build artifact
          uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
          with:
              artifact-ids: ${{ inputs.artifact_id }}
              path: build

        - name: Inspect download
          shell: bash
          run: |
              echo 'Contents after download:'
              ls -R build | head -100 || true

        - name: Compute version
          id: version
          shell: bash
          env:
              RELEASE_TYPE: ${{ inputs.release_type }}
          run: |
              set -e

              # Discard any changes to mise.toml before bumping
              git checkout -- mise.toml 2>/dev/null || true

              if [ "$RELEASE_TYPE" = 'dev' ]; then
                SHORT_SHA=$(git rev-parse --short HEAD | tr -cd 'a-fA-F0-9')
                TS=$(date +%Y%m%d%H%M%S)
                BUILD="${TS}+${SHORT_SHA}"
                echo "[DEBUG] RELEASE_TYPE=$RELEASE_TYPE"
                echo "[DEBUG] TS=$TS"
                echo "[DEBUG] SHORT_SHA=$SHORT_SHA"
                echo "[DEBUG] BUILD=$BUILD"
                echo "[DEBUG] Running: cog bump --patch --pre dev --build \"$BUILD\""
                COG_OUTPUT=$(cog bump --patch --pre dev --build "$BUILD" 2>&1)
                echo "$COG_OUTPUT"
                VERSION=$(echo "$COG_OUTPUT" | awk '/Bumped version:/ {print $NF}' | tail -n1)
              elif [ "$RELEASE_TYPE" = 'next' ]; then
                echo "[DEBUG] RELEASE_TYPE=$RELEASE_TYPE"
                echo "[DEBUG] Running: cog bump --auto --pre next"
                COG_OUTPUT=$(cog bump --auto --pre next 2>&1)
                echo "$COG_OUTPUT"
                VERSION=$(echo "$COG_OUTPUT" | awk '/Bumped version:/ {print $NF}' | tail -n1)
              else
                echo "[DEBUG] RELEASE_TYPE=$RELEASE_TYPE"
                echo "[DEBUG] Running: cog bump --auto"
                COG_OUTPUT=$(cog bump --auto 2>&1)
                echo "$COG_OUTPUT"
                VERSION=$(echo "$COG_OUTPUT" | awk '/Bumped version:/ {print $NF}' | tail -n1)
              fi

              # Validate VERSION is not empty
              if [ -z "$VERSION" ]; then
                echo "::error::Failed to compute version - cog bump returned empty string"
                echo "::error::cog output was: $COG_OUTPUT"
                exit 1
              fi

              echo "[DEBUG] VERSION=$VERSION"

              # Update package.json version if it exists
              if [ -f package.json ]; then
                echo "[DEBUG] Updating package.json version to $VERSION"
                # Use jq if available, otherwise use sed
                if command -v jq >/dev/null 2>&1; then
                  jq --arg ver "$VERSION" '.version = $ver' package.json > package.json.tmp && mv package.json.tmp package.json
                else
                  sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" package.json

                fi
                echo "[DEBUG] package.json version updated"
              fi

              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "release_name=fahrenheight-$VERSION" >> "$GITHUB_OUTPUT"
              echo "VERSION=$VERSION" >> "$GITHUB_ENV"
              echo "RELEASE_NAME=fahrenheight-$VERSION" >> "$GITHUB_ENV"
              echo "## Computed version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

        - name: Normalize artifact (zip)
          id: artifact-name
          shell: bash
          run: |
              # Handle either directory (dev build) or existing zip (next/stable)
              if [ -d build ]; then
                zip -r "${RELEASE_NAME}.zip" build
              elif [ -f build.zip ]; then
                mv build.zip "${RELEASE_NAME}.zip"
              else
                echo 'Expected build directory or build.zip not found' >&2
                exit 1
              fi
              echo "ARTIFACT=${RELEASE_NAME}.zip" >> "$GITHUB_ENV"
              echo "file=${RELEASE_NAME}.zip" >> "$GITHUB_OUTPUT"

        - name: Create checksum
          shell: bash
          run: |
              sha256sum "${RELEASE_NAME}.zip" | tee SHA256SUMS.txt
              echo "## SHA256" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"

        - name: Import GPG key
          uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
          with:
              gpg_private_key: ${{ inputs.gpg_private_key }}
              passphrase: ${{ inputs.gpg_passphrase }}
              git_user_signingkey: true
              git_commit_gpgsign: true
              git_tag_gpgsign: true
              trust_level: ultimate

        - name: Sign artifact
          shell: bash
          run: |
              gpg --batch --yes --detach-sign --armor "${ARTIFACT}"
              gpg --verify "${ARTIFACT}.asc" "${ARTIFACT}" || exit 1
              echo "Signed ${ARTIFACT}" >> "$GITHUB_STEP_SUMMARY"

        - name: Generate SLSA attestations
          uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
          with:
              subject-path: |
                  ${{ env.ARTIFACT }}

        - name: Generate release notes
          shell: bash
          env:
              RELEASE_TYPE: ${{ inputs.release_type }}
          run: |
              VERSION="${{ steps.version.outputs.version }}"
              SHORT_SHA=$(git rev-parse --short HEAD)
              PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
              if [[ -n "$PREV" ]]; then
                cog changelog --at "$VERSION" "$PREV..$VERSION" > release_notes.md || true
              else
                cog changelog --at "$VERSION" > release_notes.md || true
              fi
              if [[ ! -s release_notes.md ]]; then
                echo "# Release $VERSION" > release_notes.md
                echo "Generated without conventional commits range. Commit: $SHORT_SHA" >> release_notes.md
              fi
              cat >> release_notes.md <<EOF

              ## Verification

              ```bash
              # Get artifact + signatures
              wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${RELEASE_NAME}.zip
              wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${RELEASE_NAME}.zip.asc
              wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/SHA256SUMS.txt
              gpg --keyserver keys.openpgp.org --recv-keys <KEY_ID>
              gpg --verify ${RELEASE_NAME}.zip.asc ${RELEASE_NAME}.zip
              sha256sum -c SHA256SUMS.txt
              ```

              \`\`\`bash
              # Verify SLSA attestation (GitHub CLI)
              gh attestation verify ${RELEASE_NAME}.zip --repo ${{ github.repository }}
              \`\`\`
              EOF
              echo "Created release_notes.md" >> "$GITHUB_STEP_SUMMARY"

        - name: Create GitHub Release
          uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
          env:
              GITHUB_TOKEN: ${{ inputs.github_token }}
          with:
              tag_name: ${{ steps.version.outputs.version }}
              name: ${{ steps.version.outputs.release_name }}
              body_path: release_notes.md
              draft: false
              prerelease: ${{ inputs.release_type != 'stable' }}
              files: |
                  ${{ env.ARTIFACT }}
                  ${{ env.ARTIFACT }}.asc
                  SHA256SUMS.txt
              fail_on_unmatched_files: true

        - name: Summary
          shell: bash
          run: |
              echo "## Release Created" >> "$GITHUB_STEP_SUMMARY"
              echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
              echo "Artifact: ${ARTIFACT}" >> "$GITHUB_STEP_SUMMARY"
